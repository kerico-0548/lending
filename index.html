<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись на занятие</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #1c2534; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: 56px auto; padding: 0 20px; }
    h1 { font-size: 32px; line-height: 1.2; }
    p, small { color: #667085; }
    section { background: white; border: 1px solid #e3e7ee; border-radius: 16px; padding: 24px; margin-top: 24px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; padding: 12px; border: 1px solid #c8cfda; border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 20px; background: #315de6; border: 0; color: white; border-radius: 8px; padding: 12px 18px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <small>ТЕСТ ЗАПИСИ</small>
    <h1>Запись на занятие</h1>
    <p>Оставьте имя и контакт — заявка сохранится в базе данных.</p>
    <section>
      <form id="application-form">
        <label for="name">Имя</label>
        <input id="name" name="name" autocomplete="given-name" maxlength="80" required placeholder="Как к вам обращаться">
        <label for="contact">Телефон или email</label>
        <input id="contact" name="contact" maxlength="160" required placeholder="Как с вами связаться">
        <button id="submit" type="submit">Отправить заявку</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <small>Для проверки используйте вымышленные данные. Заявки видит только владелец в Supabase.</small>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
